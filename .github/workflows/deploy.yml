name: Deploy blog and CoinApp to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      coinapp_ref:
        description: "coinapp-web branch/tag to build (defaults to the default branch)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Both apps are served from this one Pages site, so these prefixes are fixed:
  # the blog at /blog, CoinApp at /coinapp. They must match basePath in
  # next.config.js and the --base-href below.
  BLOG_PREFIX: /blog
  APP_PREFIX: /coinapp
  # Which coinapp-web revision to build. This has to come from the event payload
  # and not the `inputs` context: that context only exists for workflow_dispatch
  # and workflow_call, and referencing it on a push fails the job at "Set up
  # job" with "Unrecognized named-value: 'inputs'". Empty means the default
  # branch, which is what a plain push wants.
  COINAPP_REF: ${{ github.event.inputs.coinapp_ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog
        uses: actions/checkout@v4
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Build with Next.js
        run: ${{ steps.detect-package-manager.outputs.runner }} next build

      # CoinApp is a separate repository. It is checked out into its own folder
      # so the blog repo stays free of Angular sources, and built with a base href
      # matching the /coinapp prefix it will be served from.
      - name: Checkout CoinApp
        uses: actions/checkout@v4
        with:
          repository: zskamljic/coinapp-web
          path: coinapp-web
          ref: ${{ env.COINAPP_REF }}
      - name: Install CoinApp dependencies
        working-directory: coinapp-web
        run: npm ci
      - name: Build CoinApp
        working-directory: coinapp-web
        run: npx --no-install ng build --base-href=${{ env.APP_PREFIX }}/

      # Moves the Next export down into out/blog, copies CoinApp into out/coinapp,
      # writes the root redirect and the shared 404.html fallback.
      - name: Assemble site
        run: node scripts/assemble-site.mjs ./out ./coinapp-web/dist/coinapp-web/browser

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4